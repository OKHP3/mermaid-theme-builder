# Dependabot configuration for Mermaid Theme Builder
# Mermaid Theme Builder is a personal OverKill Hill P³ project by Jamie Hill.
#
# Update policy:
# - Dependabot opens PRs for npm and GitHub Actions dependency updates.
# - CI runs typecheck and build on each PR.
# - The Mermaid capability registry (src/data/mermaid-capabilities.ts) must be
#   reviewed and updated when mermaid itself is upgraded, before merging.
# - All PRs require human review and merge.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      react-family:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      tailwind-family:
        patterns: ["tailwindcss", "@tailwindcss/*"]
        update-types: ["minor", "patch"]
      vite-family:
        patterns: ["vite", "@vitejs/plugin-react"]
        update-types: ["minor", "patch"]
      maintenance:
        patterns: ["*"]
        exclude-patterns:
          [
            "mermaid",
            "@mermaid-js/*",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
            "tailwindcss",
            "@tailwindcss/*",
            "vite",
            "@vitejs/plugin-react",
          ]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Mermaid major version upgrades require registry review. Handle manually.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-pnpm"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
