name: Setup pnpm + Node.js
description: >
  Configures Node.js, enables the repository-pinned pnpm through Corepack, caches
  its content-addressable store, and runs
  `pnpm install --frozen-lockfile --ignore-scripts`.
  NOTE: the calling workflow must run `actions/checkout` before this action.
  local composite actions are resolved from the checked-out workspace.
  Centralizing these steps means a single version bump here propagates
  to every workflow that uses this action.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache Corepack package managers
      uses: actions/cache@v6
      with:
        path: ~/.cache/node/corepack
        key: corepack-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-${{ hashFiles('package.json') }}
        restore-keys: |
          corepack-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-

    - name: Enable the repository-pinned pnpm
      run: |
        corepack enable pnpm
        corepack pnpm --version
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    - name: Cache pnpm content-addressable store
      uses: actions/cache@v6
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
