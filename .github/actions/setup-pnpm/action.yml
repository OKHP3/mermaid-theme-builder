name: Setup pnpm + Node.js
description: >
  Configures Node.js, installs the repository-pinned native pnpm, caches
  its content-addressable store, and runs
  `pnpm install --frozen-lockfile --ignore-scripts`.
  NOTE: the calling workflow must run `actions/checkout` before this action.
  local composite actions are resolved from the checked-out workspace.
  Centralizing these steps means a single version bump here propagates
  to every workflow that uses this action.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version

    - name: Enable the repository-pinned pnpm
      run: |
        manager=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')
        [[ "$manager" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        npm install --global "$manager" --ignore-scripts
        test "$(pnpm --version)" = "${manager#pnpm@}"
      shell: bash

    - name: Cache pnpm content-addressable store
      uses: actions/cache@v6
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
