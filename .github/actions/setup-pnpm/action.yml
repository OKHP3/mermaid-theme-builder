name: Setup pnpm + Node.js
description: >
  Sets up pnpm, configures Node.js with the pnpm cache, and runs
  `pnpm install --frozen-lockfile --ignore-scripts`.
  NOTE: the calling workflow must run `actions/checkout` before this action —
  local composite actions are resolved from the checked-out workspace.
  Centralising these three steps means a single version bump here propagates
  to every workflow that uses this action.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Cache pnpm content-addressable store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
