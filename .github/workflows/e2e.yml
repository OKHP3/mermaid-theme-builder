name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: "4173"
      BASE_PATH: /mermaid-theme-builder/
      PLAYWRIGHT_BASE_URL: http://localhost:4173/mermaid-theme-builder/
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build
        run: pnpm build

      - name: Start preview server
        run: pnpm serve &

      - name: Wait for server
        run: |
          server_ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/mermaid-theme-builder/; then
              echo "Server ready"
              server_ready=true
              break
            fi
            echo "Waiting... attempt $i"
            sleep 2
          done
          if [ "$server_ready" != "true" ]; then
            echo "Preview server did not start after 30 attempts" >&2
            exit 1
          fi

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
