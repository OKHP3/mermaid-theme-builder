name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: "18624"
      BASE_PATH: /mermaid-theme-builder/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Format check (Prettier)
        run: pnpm run format

      - name: Version string check
        run: pnpm run check:version-strings

      - name: Documentation truth check
        run: pnpm run check:doc-truth

      - name: Source reference check
        run: pnpm run check:source-refs
