name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Unit tests, typecheck, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Type check
        run: pnpm run typecheck

      - name: Format check (Prettier)
        run: pnpm prettier --check "src/**/*.{ts,tsx,css}" "*.ts" "*.json"

      - name: Version string check
        run: pnpm run check:version-strings
