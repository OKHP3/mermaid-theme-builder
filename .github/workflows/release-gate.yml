name: Release CHANGELOG gate

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog-check:
    name: Verify CHANGELOG entry for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check CHANGELOG has versioned entry for ${{ github.ref_name }}
        run: bash scripts/check-changelog.sh "${{ github.ref_name }}"

  capture-screenshot:
    name: Capture README screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PORT: "4173"
      BASE_PATH: /mermaid-theme-builder/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Start preview server
        run: pnpm serve &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/mermaid-theme-builder/ && echo "Server ready" && break
            echo "Waiting... attempt $i"
            sleep 2
          done

      - name: Capture screenshot
        run: pnpm run capture-screenshot

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: readme-screenshot-${{ github.ref_name }}
          path: docs/screenshot-v0.5.0.jpg
          retention-days: 30

      - name: Commit refreshed screenshot on an automation branch
        id: screenshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshot-v0.5.0.jpg
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Screenshot unchanged, no PR is needed."
            exit 0
          fi
          branch="automation/refresh-readme-screenshot-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "chore: refresh README screenshot for ${{ github.ref_name }} [skip ci]"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open screenshot update pull request
        id: screenshot-pr
        if: steps.screenshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh pr create \
            --base main \
            --head "${{ steps.screenshot.outputs.branch }}" \
            --title "chore: refresh README screenshot for ${{ github.ref_name }}" \
            --body "Automated screenshot refresh generated by the release gate for ${{ github.ref_name }}.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Queue screenshot update for automatic merge
        if: steps.screenshot.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.screenshot-pr.outputs.url }}" \
            --auto \
            --squash \
            --delete-branch
