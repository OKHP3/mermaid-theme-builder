name: Skill Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-tests:
    name: okhp3-mermaid-theme-builder skill suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Run skill tests
        working-directory: skills/okhp3-mermaid-theme-builder
        run: node --test tests/*.test.mjs

      - name: Setup stable Python for support utilities
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Test Python support utilities
        env:
          PYTHONUTF8: "1"
        run: |
          git ls-files -z '*test*.py' | while IFS= read -r -d '' test_file; do
            python "$test_file"
          done
