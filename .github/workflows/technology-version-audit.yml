name: Technology Version Audit

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: technology-version-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit all packages, actions, and runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The audit uses Node built-ins and reads the lockfile. No dependency
      # installation is needed, so a broken install cannot conceal drift.
      - name: Test audit and issue handling
        run: node --test scripts/check-technology-versions.test.mjs scripts/update-technology-issue.test.mjs

      - name: Run technology version audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-technology-versions.mjs --output-dir "$RUNNER_TEMP/technology-audit" --fail-on-errors

      - name: Add audit summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/technology-audit/technology-version-summary.md" ]; then
            cat "$RUNNER_TEMP/technology-audit/technology-version-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit failed before producing a report. Review the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Maintain one review issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/technology-audit/technology-version-report.json" ]; then
            node scripts/update-technology-issue.mjs "$RUNNER_TEMP/technology-audit/technology-version-report.json"
          fi

      - name: Upload complete audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technology-version-report
          path: ${{ runner.temp }}/technology-audit/
          retention-days: 30
          if-no-files-found: error
