    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mtb.theme");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "light";
          var resolved = mode === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          var root = document.documentElement;
          if (resolved === "dark") root.classList.add("dark");
          root.dataset.themeMode = mode;
        } catch (e) {
          /* ignore — render light on error */
        }
      })();
    </script>
    <!-- Plausible receives one aggregate pageview with the hash and query removed. -->
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
      window.plausible.init =
        window.plausible.init ||
        function (options) {
          window.plausible.o = options || {};
        };
      window.plausible.init({ autoCapturePageviews: false });
    </script>
    <script defer data-domain="okhp3.github.io" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
